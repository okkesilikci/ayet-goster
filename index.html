<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2e9"><link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAb8AAAG/CAMAAAD/zSlAAAAAmVBMVEVaR0f///9YRET8/PxVQUH5+flQOztTPj5MNzf09PRJMzPv7+/m5eVHMDDr6+vf3t7MyspBKCjY19euq6rT0dG3tLSno6PBvr6NiIeJgYF5cXBxZ2ecmJeAeXhrYmHGxMRcT047ISFkWFhBMC81GBiWj49USEcvDQ0oAABLPTw5JSQiAAAaAAAsAAAoEBBFPT0PAA"/><link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAb8AAAG/CAMAAAD/zSlAAAAAmVBMVEVaR0f///9YRET8/PxVQUH5+flQOztTPj5MNzf09PRJMzPv7+/m5eVHMDDr6+vf3t7MyspBKCjY19euq6rT0dG3tLSno6PBvr6NiIeJgYF5cXBxZ2ecmJeAeXhrYmHGxMRcT047ISFkWFhBMC81GBiWj49USEcvDQ0oAABLPTw5JSQiAAAaAAAsAAAoEBBFPT0PAA"/><title>Ayet Göster</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f2e9;color:#27241f;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;padding:28px}main{width:min(650px,100%);text-align:center}.title{font-size:12px;letter-spacing:3px;text-transform:uppercase;opacity:.45;margin-bottom:34px}#ref{font-size:18px;font-weight:650;margin-bottom:28px}#meal{font-family:Georgia,"Times New Roman",serif;font-size:21px;line-height:1.7;max-width:590px;margin:0 auto 42px}button{border:0;border-radius:50px;padding:17px 34px;background:#27241f;color:#fff;font-size:17px;font-weight:700;box-shadow:0 9px 25px rgba(0,0,0,.14);cursor:pointer}button:active{transform:scale(.97)}#status{margin-top:16px;font-size:12px;opacity:.45;min-height:18px}</style></head><body><main><div class="title">Kur'an-ı Kerîm</div><div id="ref">Hazır</div><div id="meal">Rastgele bir ayet görmek için aşağıdaki düğmeye bas.</div><button id="show">AYET GÖSTER</button><div id="status"></div></main><script>const DATA_URL='https://raw.githubusercontent.com/Dfurkantopdas/haev-meals/main/meals/diyanet.json';const SURAH_NAMES=['Fâtiha','Bakara','Âl-i İmrân','Nisâ','Mâide','En’âm','A’râf','Enfâl','Tevbe','Yûnus','Hûd','Yûsuf','Ra’d','İbrâhîm','Hicr','Nahl','İsrâ','Kehf','Meryem','Tâhâ','Enbiyâ','Hac','Mü’minûn','Nûr','Furkân','Şuarâ','Neml','Kasas','Ankebût','Rûm','Lokmân','Secde','Ahzâb','Sebe’','Fâtır','Yâsîn','Sâffât','Sâd','Zümer','Mü’min','Fussilet','Şûrâ','Zuhruf','Duhân','Câsiye','Ahkâf','Muhammed','Fetih','Hucurât','Kâf','Zâriyât','Tûr','Necm','Kamer','Rahmân','Vâkıa','Hadîd','Mücâdele','Haşr','Mümtehine','Saff','Cuma','Münâfikûn','Teğâbün','Talâk','Tahrîm','Mülk','Kalem','Hâkka','Meâric','Nûh','Cin','Müzzemmil','Müddessir','Kıyâmet','İnsân','Mürselât','Nebe’','Nâziât','Abese','Tekvîr','İnfitâr','Mutaffifîn','İnşikâk','Burûc','Târık','A’lâ','Gâşiye','Fecr','Beled','Şems','Leyl','Duhâ','İnşirâh','Tîn','Alak','Kadir','Beyyine','Zilzâl','Âdiyât','Kâria','Tekâsür','Asr','Hümeze','Fîl','Kureyş','Mâûn','Kevser','Kâfirûn','Nasr','Tebbet','İhlâs','Felak','Nâs'];let verses=[],last=-1;async function load(){if(verses.length)return;const r=await fetch(DATA_URL);if(!r.ok)throw Error();const d=await r.json();for(const s of d.surahs)for(const v of s.verses)verses.push({s:s.id,a:v.id,t:v.translation})}async function show(){const b=document.getElementById('show'),st=document.getElementById('status');b.disabled=true;st.textContent='Yükleniyor…';try{await load();let i;do{i=Math.floor(Math.random()*verses.length)}while(i===last&&verses.length>1);last=i;const v=verses[i],surah=SURAH_NAMES[Number(v.s)-1]||('Sure '+v.s);document.getElementById('ref').textContent=surah+' · '+v.a+'. Ayet';document.getElementById('meal').textContent=v.t;st.textContent=''}catch(e){st.textContent='İçerik yüklenemedi.'}b.disabled=false}document.getElementById('show').onclick=show;</script></body></html>
